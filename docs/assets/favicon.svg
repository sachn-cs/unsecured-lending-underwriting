<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Underwrite mark">
  <title>Underwrite mark</title>
  <defs>
    <style>
      .uw-stroke-fav { fill: none; stroke: #FFFFFF; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .uw-fill-fav { fill: #FFFFFF; }
      .uw-accent-fav { fill: #6B8AFF; }
      .uw-accent-stroke-fav { fill: none; stroke: #6B8AFF; stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="64" height="64" rx="10" fill="#0A0E14"/>

  <g class="uw-stroke-fav" opacity="0.55">
    <line x1="8"  y1="20" x2="30" y2="32" />
    <line x1="8"  y1="32" x2="30" y2="32" />
    <line x1="8"  y1="44" x2="30" y2="32" />
  </g>

  <g class="uw-fill-fav">
    <circle cx="8"  cy="20" r="1.5" />
    <circle cx="8"  cy="32" r="1.5" />
    <circle cx="8"  cy="44" r="1.5" />
  </g>

  <g>
    <rect x="27" y="26.5" width="11" height="11" rx="1.6" class="uw-stroke-fav" />
    <rect x="29.5" y="29" width="6" height="6" rx="0.8" class="uw-accent-stroke-fav" />
    <rect x="31" y="30.5" width="3" height="3" class="uw-accent-fav" />
  </g>

  <g class="uw-stroke-fav">
    <line x1="38" y1="32" x2="54" y2="32" />
    <polyline points="50,28.5 54,32 50,35.5" />
  </g>

  <g class="uw-accent-stroke-fav" opacity="0.65">
    <path d="M 12 49 C 22 49, 25 42, 33 42 S 46 49, 56 42" />
  </g>
</svg>